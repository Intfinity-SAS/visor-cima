<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tus fotos del mirador</title>
<!--
  Página pública de fotos con visor 360. El QR de "Enviar" abre
  <esta página>#<carpeta de Drive de la tanda> (Config.ViewerURL, ver
  server/drive.go). Lee la carpeta con la API de Drive y una clave de API
  (config.js): las carpetas ya son públicas con el enlace. Las fotos son
  foto-NN.jpg y, de la Insta360, su 360 foto-NN.360.jpg (6144×3072).
-->
<style>
  /* Colores del logo de La Cima de la 13: verde-gris pizarra (#24393b, las
     letras y el faro) sobre blanco, con sus grises. Nada fuera de eso. */
  :root { --logo:#24393b; --bg:#0f1b1c; --card:#1a2a2c; --card2:#26393b; --fg:#f4f7f7; --dim:#9fb2b2; --accent:#ffffff; --on-accent:#24393b; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:20px 16px 8px; display:flex; align-items:center; gap:14px; }
  header .logo { width:64px; height:64px; border-radius:14px; background:#fff; object-fit:cover; flex:none; }
  h1 { margin:0; font-size:22px; }
  .brand { margin:0 0 2px; color:var(--dim); font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  #status { color:var(--dim); margin:4px 0 0; font-size:14px; display:flex; align-items:center; gap:8px; }
  /* "En vivo": la carpeta es reciente y se revisa cada pocos segundos. */
  #status.live::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--fg); box-shadow:0 0 0 3px rgba(255,255,255,.18); flex:none; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .card.new { animation:arrive .5s ease-out; }
  @keyframes arrive { from { opacity:0; transform:translateY(8px); } }
  footer { text-align:center; color:var(--dim); font-size:13px; padding:0 16px 28px; }
  footer img { width:40px; height:40px; border-radius:10px; background:#fff; object-fit:cover; display:block; margin:0 auto 6px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; padding:12px 16px 32px; }
  .card { background:var(--card); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .card img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--card2); cursor:zoom-in; }
  .acts { display:flex; flex-direction:column; gap:6px; padding:8px; }
  .acts a, .acts button { flex:1; text-align:center; font:inherit; font-size:14px; padding:8px 4px; border-radius:8px; border:0; text-decoration:none; color:var(--fg); background:var(--card2); cursor:pointer; }
  /* Como el logo: blanco con letras verde-gris. */
  .acts .b360 { background:var(--accent); color:var(--on-accent); font-weight:700; }
  .over { position:fixed; inset:0; background:#0a1213; display:none; z-index:10; }
  .over.on { display:block; }
  .over canvas, .over .big { width:100%; height:100%; display:block; touch-action:none; }
  .over .big { object-fit:contain; }
  .close { position:absolute; top:max(12px,env(safe-area-inset-top)); right:12px; z-index:2; font-size:16px; font-weight:600; padding:10px 14px; border-radius:20px; border:0; background:rgba(255,255,255,.92); color:var(--on-accent); }
  .hint { position:absolute; left:0; right:0; bottom:calc(max(16px,env(safe-area-inset-bottom)) + 62px); text-align:center; color:#fff; font-size:14px; text-shadow:0 1px 3px #000; pointer-events:none; padding:0 16px; }
  /* Marco 4:3 de "Guardar esta vista": lo de adentro es lo que se guarda; afuera, más oscuro. */
  .frame43 { display:none; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(92vw, calc((100dvh - 190px) * 4 / 3)); aspect-ratio:4/3; border:2px solid rgba(255,255,255,.9); border-radius:6px; box-shadow:0 0 0 200vmax rgba(10,18,19,.45); pointer-events:none; }
  .panobar { display:none; position:absolute; left:16px; right:16px; bottom:max(14px,env(safe-area-inset-bottom)); gap:8px; justify-content:center; }
  .panobar button { flex:1; max-width:220px; font:inherit; font-size:15px; font-weight:700; padding:12px 10px; border-radius:12px; border:0; cursor:pointer; background:var(--accent); color:var(--on-accent); }
  .panobar button#panoFull { background:rgba(255,255,255,.16); color:#fff; }
  #pano.ready .frame43 { display:block; }
  #pano.ready .panobar { display:flex; }
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.jpg" alt="La Cima de la 13">
  <div>
    <p class="brand">La Cima de la 13</p>
    <h1>Tus fotos del mirador</h1>
    <p id="status">Cargando tus fotos…</p>
  </div>
</header>
<main id="grid"></main>
<footer><img src="logo.jpg" alt="">Gracias por visitar La Cima de la 13</footer>

<div class="over" id="photo"><button class="close" data-close>Cerrar</button><img class="big" alt=""></div>
<div class="over" id="pano"><button class="close" data-close>Cerrar</button><canvas></canvas>
  <div class="frame43" id="panoFrame"></div>
  <div class="hint" id="panoHint"></div>
  <div class="panobar"><button id="panoView" data-label="Guardar esta vista">Guardar esta vista</button><button id="panoFull" data-label="Descargar la 360">Descargar la 360</button></div>
</div>

<script src="config.js"></script>
<script>
'use strict'
const CFG = Object.assign({
  apiKey: '',
  api: 'https://www.googleapis.com/drive/v3',
  thumb: 'https://drive.google.com/thumbnail',
  download: 'https://drive.google.com/uc?export=download&id=',
}, window.VISOR || {})
const folder = decodeURIComponent(location.hash.slice(1)).replace(/[^A-Za-z0-9_-]/g, '')
const $ = (s) => document.querySelector(s)
const status = (t) => { $('#status').textContent = t }

// ---------- lista de la carpeta ----------
async function list() {
  const q = `'${folder}' in parents and trashed = false`
  const u = `${CFG.api}/files?q=${encodeURIComponent(q)}&fields=files(id,name)&orderBy=name&pageSize=200&key=${encodeURIComponent(CFG.apiKey)}`
  const r = await fetch(u)
  if (!r.ok) throw new Error('HTTP ' + r.status)
  return (await r.json()).files || []
}

const shown = new Map() // "foto-01" → tarjeta
function render(files) {
  const photos = {}, panos = {}
  for (const f of files) {
    const m = /^(foto-\d+)(\.360)?\.jpg$/.exec(f.name)
    if (!m) continue
    if (m[2]) panos[m[1]] = f.id; else photos[m[1]] = f.id
  }
  for (const name of Object.keys(photos).sort()) {
    let card = shown.get(name)
    if (!card) {
      card = document.createElement('div')
      card.className = firstPaint ? 'card' : 'card new' // las que llegan después aparecen con animación
      card.innerHTML = `<img alt="Foto" loading="lazy"><div class="acts"><button class="dl">Descargar</button></div>`
      const img = card.querySelector('img')
      img.src = `${CFG.thumb}?id=${photos[name]}&sz=w800`
      // Recién subida, Google tarda unos segundos en tener la miniatura: se reintenta.
      let tries = 0
      img.onerror = () => { if (++tries <= 8) setTimeout(() => { img.src = `${CFG.thumb}?id=${photos[name]}&sz=w800&r=${tries}` }, 3000) }
      img.onclick = () => openPhoto(photos[name])
      const dl = card.querySelector('.dl')
      dl.onclick = () => download(dl, photos[name], name)
      $('#grid').append(card)
      shown.set(name, card)
    }
    if (panos[name] && !card.querySelector('.b360')) {
      const b = document.createElement('button')
      b.className = 'b360'
      b.textContent = 'Ver en 360°'
      b.onclick = () => openPano(panos[name], name)
      card.querySelector('.acts').prepend(b)
    }
  }
  return Object.keys(photos).length
}

// Las fotos suben de a una después del QR (las 360 pueden tardar hasta ~5 min
// en pegarse). Mientras la carpeta tenga menos de LIVE_MIN minutos se revisa
// cada LIVE_EVERY ("en vivo": aparecen solas apenas suben); una carpeta vieja
// se carga una vez y no se le sigue preguntando a Google.
const LIVE_MIN = 10, LIVE_EVERY = 3000
let firstPaint = true
async function created() {
  try {
    const r = await fetch(`${CFG.api}/files/${folder}?fields=createdTime&supportsAllDrives=true&key=${encodeURIComponent(CFG.apiKey)}`)
    if (r.ok) return new Date((await r.json()).createdTime).getTime()
  } catch (e) {}
  return Date.now() // sin saberlo, se trata como recién creada
}
const plural = (n) => `${n} ${n === 1 ? 'foto' : 'fotos'}`
let wake = null // para revisar ya al volver a la pestaña
document.addEventListener('visibilitychange', () => { if (!document.hidden && wake) wake() })
async function poll() {
  if (!folder) { status('Este enlace no trae fotos. Escanea otra vez el código QR.'); return }
  const until = (await created()) + LIVE_MIN * 60 * 1000
  let last = -1, fails = 0
  for (;;) {
    const live = Date.now() < until
    try {
      const n = render(await list())
      firstPaint = false
      fails = 0
      if (n !== last || !live) {
        status(live
          ? (n ? `${plural(n)} · ¡estamos subiendo tus fotos, van apareciendo aquí solas!` : '¡Estamos subiendo tus fotos! Aparecen aquí en un momento')
          : (n ? plural(n) : 'Todavía no hay fotos aquí.'))
        $('#status').classList.toggle('live', live)
      }
      last = n
    } catch (e) {
      if (++fails >= 3 && last < 0) status('No se pudieron cargar las fotos. Revisa tu conexión y vuelve a abrir el enlace.')
    }
    if (!live && last >= 0) return
    // En segundo plano no se pregunta: al volver a la pestaña se revisa enseguida.
    await new Promise((r) => {
      wake = r
      if (!document.hidden) setTimeout(r, live ? LIVE_EVERY : 30000)
    })
    wake = null
  }
}

// ---------- descargar al celular, en calidad completa ----------
// El archivo original de Drive (por la API, como la 360), no la página de
// Drive. En iPhone se abre el menú de compartir ("Guardar imagen" la deja en
// Fotos; un enlace normal la mandaría a Archivos); en Android y en el
// computador se descarga directo. Si algo falla, se abre el enlace de Drive.
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
const blobs = new Map() // id → File ya bajado (el segundo toque no vuelve a bajarlo)
async function fetchFile(id, filename) {
  let file = blobs.get(id)
  if (!file) {
    const r = await fetch(`${CFG.api}/files/${id}?alt=media&key=${encodeURIComponent(CFG.apiKey)}`)
    if (!r.ok) throw new Error('HTTP ' + r.status)
    file = new File([await r.blob()], filename, { type: 'image/jpeg' })
    blobs.set(id, file)
  }
  return file
}

// saveFile deja el archivo en el celular (o el computador) y lo dice en el botón.
async function saveFile(btn, file, label) {
  if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] })
      btn.textContent = '¡Guardada!'
    } catch (e) {
      // Safari solo abre el menú justo después de un toque: si preparar el
      // archivo tardó, hace falta tocar otra vez (ya está listo: es instantáneo).
      btn.textContent = e.name === 'AbortError' ? label : 'Toca para guardar en Fotos'
    }
  } else {
    const a = document.createElement('a')
    a.href = URL.createObjectURL(file)
    a.download = file.name
    document.body.append(a)
    a.click()
    a.remove()
    setTimeout(() => URL.revokeObjectURL(a.href), 60000)
    btn.textContent = '¡Descargada!'
  }
}

async function download(btn, id, name) {
  if (btn.disabled) return
  const label = 'Descargar'
  try {
    if (!blobs.has(id)) { btn.disabled = true; btn.textContent = 'Descargando…' }
    const file = await fetchFile(id, `La-Cima-de-la-13-${name}.jpg`)
    await saveFile(btn, file, label)
  } catch (e) {
    btn.textContent = label
    location.href = CFG.download + id // respaldo: el enlace de Drive
  } finally {
    btn.disabled = false
  }
}

// ---------- foto grande ----------
function openPhoto(id) {
  const o = $('#photo')
  o.querySelector('img').src = `${CFG.thumb}?id=${id}&sz=w2000`
  o.classList.add('on')
}
document.querySelectorAll('[data-close]').forEach((b) => b.onclick = () => {
  b.parentElement.classList.remove('on')
  if (b.parentElement.id === 'pano') pano.stop()
})

// ---------- visor 360 (mismo cálculo que web/src/Pano360.jsx) ----------
const pano = (() => {
  const c = $('#pano canvas')
  let g, U, tex, raf = 0, ready = false, dirty = true
  const START = { yaw: 0, pitch: 0, fov: 90 }
  let view = { ...START }
  const VS = 'attribute vec2 p; varying vec2 v; void main(){ v=p; gl_Position=vec4(p,0.,1.); }'
  const FS = `precision highp float; varying vec2 v; uniform sampler2D tex; uniform float yaw, pitch, tanHalf, aspect;
    const float PI = 3.14159265358979;
    void main(){
      vec3 d = normalize(vec3(v.x*tanHalf*aspect, v.y*tanHalf, 1.0));
      float cp=cos(pitch), sp=sin(pitch); d = vec3(d.x, d.y*cp + d.z*sp, -d.y*sp + d.z*cp);
      float cy=cos(yaw), sy=sin(yaw); d = vec3(d.x*cy + d.z*sy, d.y, -d.x*sy + d.z*cy);
      float lon = atan(d.x, d.z), lat = asin(clamp(d.y,-1.,1.));
      gl_FragColor = texture2D(tex, vec2(lon/(2.*PI)+0.5, 0.5-lat/PI));
    }`
  function init() {
    if (g) return true
    g = c.getContext('webgl', { antialias: false })
    if (!g) return false
    const sh = (t, s) => { const x = g.createShader(t); g.shaderSource(x, s); g.compileShader(x); return x }
    const prog = g.createProgram()
    g.attachShader(prog, sh(g.VERTEX_SHADER, VS)); g.attachShader(prog, sh(g.FRAGMENT_SHADER, FS))
    g.linkProgram(prog); g.useProgram(prog)
    g.bindBuffer(g.ARRAY_BUFFER, g.createBuffer())
    g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), g.STATIC_DRAW)
    const loc = g.getAttribLocation(prog, 'p')
    g.enableVertexAttribArray(loc); g.vertexAttribPointer(loc, 2, g.FLOAT, false, 0, 0)
    tex = g.createTexture(); g.bindTexture(g.TEXTURE_2D, tex)
    for (const [k, v] of [[g.TEXTURE_MIN_FILTER, g.LINEAR], [g.TEXTURE_MAG_FILTER, g.LINEAR], [g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE], [g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE]]) g.texParameteri(g.TEXTURE_2D, k, v)
    U = {}
    for (const n of ['yaw', 'pitch', 'tanHalf', 'aspect']) U[n] = g.getUniformLocation(prog, n)
    return true
  }
  function resize() {
    const r = c.getBoundingClientRect(), k = Math.min(devicePixelRatio || 1, 2)
    c.width = Math.max(1, Math.round(r.width * k)); c.height = Math.max(1, Math.round(r.height * k)); dirty = true
  }
  let last = 0
  function draw(t) {
    // Inercia: después de soltar el dedo sigue girando y frena solo.
    const dt = Math.min(50, last ? t - last : 16); last = t
    if (!pts.size && (Math.abs(vel.yaw) > 0.002 || Math.abs(vel.pitch) > 0.002)) {
      look(vel.yaw * dt, vel.pitch * dt)
      const f = Math.exp(-dt / FRICTION_MS); vel.yaw *= f; vel.pitch *= f
    }
    if (ready && dirty) {
      g.viewport(0, 0, c.width, c.height)
      g.uniform1f(U.yaw, view.yaw * Math.PI / 180)
      g.uniform1f(U.pitch, view.pitch * Math.PI / 180)
      g.uniform1f(U.tanHalf, Math.tan(view.fov * Math.PI / 360))
      g.uniform1f(U.aspect, c.width / c.height)
      g.drawArrays(g.TRIANGLE_STRIP, 0, 4)
      dirty = false
    }
    raf = requestAnimationFrame(draw)
  }
  addEventListener('resize', () => { if (ready) resize() })

  // Un dedo (o el mouse) mira alrededor; dos dedos o la rueda acercan.
  // GAIN: grados por píxel respecto a "la foto pegada al dedo". Con 1, en un
  // celular vertical un barrido de lado a lado gira ~40° (había que barrer
  // nueve veces para dar la vuelta); con el dedo va más rápido que con mouse.
  const GAIN_TOUCH = 2.2, GAIN_MOUSE = 1.3, FRICTION_MS = 320
  const pts = new Map()
  let drag = null, pinch = null
  const vel = { yaw: 0, pitch: 0 } // grados por ms
  function look(dyaw, dpitch) {
    view.yaw = (view.yaw + dyaw) % 360
    view.pitch = Math.max(-89, Math.min(89, view.pitch + dpitch)); dirty = true
  }
  function startDrag(e) { drag = { x: e.clientX, y: e.clientY, t: e.timeStamp }; vel.yaw = vel.pitch = 0 }
  c.addEventListener('pointerdown', (e) => {
    c.setPointerCapture(e.pointerId); pts.set(e.pointerId, e)
    if (pts.size === 1) startDrag(e)
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), fov: view.fov }; drag = null }
  })
  c.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return
    pts.set(e.pointerId, e)
    if (pinch && pts.size === 2) {
      const [a, b] = [...pts.values()]
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)
      view.fov = Math.max(30, Math.min(120, pinch.fov * pinch.d / Math.max(d, 1))); dirty = true
    } else if (drag) {
      // Paso a paso desde el último punto, para que no salte al pasar de dos dedos a uno.
      const k = view.fov / c.getBoundingClientRect().height * (e.pointerType === 'mouse' ? GAIN_MOUSE : GAIN_TOUCH)
      const dy = -(e.clientX - drag.x) * k, dp = (e.clientY - drag.y) * k
      look(dy, dp)
      const dt = Math.max(1, e.timeStamp - drag.t)
      // Velocidad suavizada de los últimos movimientos (para la inercia al soltar).
      vel.yaw = 0.6 * (dy / dt) + 0.4 * vel.yaw; vel.pitch = 0.6 * (dp / dt) + 0.4 * vel.pitch
      drag = { x: e.clientX, y: e.clientY, t: e.timeStamp }
    }
  })
  const up = (e) => {
    pts.delete(e.pointerId)
    if (pts.size < 2) pinch = null
    if (pts.size === 1) { startDrag([...pts.values()][0]); return } // de pellizco a un dedo: sigue moviendo
    // Si el dedo se quedó quieto antes de soltar, no hay inercia.
    if (!pts.size) { if (drag && e.timeStamp - drag.t > 80) vel.yaw = vel.pitch = 0; drag = null }
  }
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up)
  c.addEventListener('wheel', (e) => { e.preventDefault(); view.fov = Math.max(30, Math.min(120, view.fov * Math.exp(e.deltaY * 0.001))); dirty = true }, { passive: false })
  c.addEventListener('dblclick', () => { view = { ...START }; vel.yaw = vel.pitch = 0; dirty = true })

  // snapshot: la parte de la 360 que está dentro del marco 4:3 (#panoFrame),
  // como foto JPEG. Se dibuja aparte (framebuffer) a la resolución que da la
  // 360 en ese recorte, no a la de la pantalla.
  let texW = 0
  function snapshot() {
    if (!ready) return Promise.resolve(null)
    const fr = $('#panoFrame').getBoundingClientRect(), cr = c.getBoundingClientRect()
    const tanHalf = Math.tan(view.fov * Math.PI / 360) * (fr.height / cr.height) // el marco ve menos que la pantalla
    const horiz = 2 * Math.atan(tanHalf * 4 / 3) * 180 / Math.PI // grados que cubre a lo ancho
    const maxDim = Math.min(g.getParameter(g.MAX_RENDERBUFFER_SIZE), g.getParameter(g.MAX_VIEWPORT_DIMS)[0], 4096)
    const W = Math.max(1200, Math.min(maxDim, Math.round(texW * horiz / 360 * 1.25 / 4) * 4)), H = Math.round(W * 3 / 4)
    const rt = g.createTexture(); g.bindTexture(g.TEXTURE_2D, rt)
    g.texImage2D(g.TEXTURE_2D, 0, g.RGBA, W, H, 0, g.RGBA, g.UNSIGNED_BYTE, null)
    for (const [k, v] of [[g.TEXTURE_MIN_FILTER, g.LINEAR], [g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE], [g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE]]) g.texParameteri(g.TEXTURE_2D, k, v)
    const fb = g.createFramebuffer(); g.bindFramebuffer(g.FRAMEBUFFER, fb)
    g.framebufferTexture2D(g.FRAMEBUFFER, g.COLOR_ATTACHMENT0, g.TEXTURE_2D, rt, 0)
    g.bindTexture(g.TEXTURE_2D, tex)
    g.viewport(0, 0, W, H)
    g.uniform1f(U.yaw, view.yaw * Math.PI / 180); g.uniform1f(U.pitch, view.pitch * Math.PI / 180)
    g.uniform1f(U.tanHalf, tanHalf); g.uniform1f(U.aspect, 4 / 3)
    g.drawArrays(g.TRIANGLE_STRIP, 0, 4)
    const px = new Uint8Array(W * H * 4)
    g.readPixels(0, 0, W, H, g.RGBA, g.UNSIGNED_BYTE, px)
    g.bindFramebuffer(g.FRAMEBUFFER, null); g.deleteFramebuffer(fb); g.deleteTexture(rt)
    dirty = true
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H
    const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H)
    for (let y = 0; y < H; y++) img.data.set(px.subarray((H - 1 - y) * W * 4, (H - y) * W * 4), y * W * 4) // WebGL lee de abajo hacia arriba
    ctx.putImageData(img, 0, 0)
    return new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.92))
  }

  let gen = 0
  return {
    snapshot,
    async open(id) {
      const my = ++gen
      const hint = $('#panoHint')
      $('#pano').classList.add('on')
      $('#pano').classList.remove('ready')
      ready = false
      if (!init()) { hint.textContent = 'Este celular no puede mostrar la 360.'; return }
      resize()
      cancelAnimationFrame(raf); raf = requestAnimationFrame(draw)
      hint.textContent = 'Cargando la 360…'
      try {
        // El archivo queda guardado: "Descargar la 360" no lo vuelve a bajar.
        const file = await fetchFile(id, `La-Cima-de-la-13-${panoName}-360.jpg`)
        const bmp = await createImageBitmap(file)
        if (my !== gen) return
        let pic = bmp
        const max = g.getParameter(g.MAX_TEXTURE_SIZE)
        if (bmp.width > max) {
          const cv = document.createElement('canvas')
          cv.width = max; cv.height = Math.round(max * bmp.height / bmp.width)
          cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height); pic = cv
        }
        g.bindTexture(g.TEXTURE_2D, tex)
        g.texImage2D(g.TEXTURE_2D, 0, g.RGB, g.RGB, g.UNSIGNED_BYTE, pic)
        texW = pic.width
        view = { ...START }; vel.yaw = vel.pitch = 0; ready = true; dirty = true
        $('#pano').classList.add('ready')
        hint.textContent = 'Arrastra y pellizca para encuadrar lo que quieras dentro del marco'
      } catch (e) {
        if (my === gen) hint.textContent = 'No se pudo cargar la 360. Inténtalo de nuevo.'
      }
    },
    stop() { gen++; cancelAnimationFrame(raf); ready = false },
  }
})()
// La 360 abierta: su id en Drive y el nombre de la foto ("foto-01").
let panoId = '', panoName = ''
const openPano = (id, name) => {
  panoId = id; panoName = name
  for (const b of [$('#panoView'), $('#panoFull')]) { b.disabled = false; b.textContent = b.dataset.label }
  return pano.open(id)
}

// "Guardar esta vista": lo que está dentro del marco, en 4:3.
$('#panoView').onclick = async (e) => {
  const btn = e.currentTarget
  if (btn.disabled) return
  btn.disabled = true; btn.textContent = 'Preparando…'
  try {
    const blob = await pano.snapshot()
    if (!blob) throw new Error('sin imagen')
    const n = (btn.count = (btn.count || 0) + 1)
    btn.disabled = false
    await saveFile(btn, new File([blob], `La-Cima-de-la-13-${panoName}-vista-${n}.jpg`, { type: 'image/jpeg' }), btn.dataset.label)
  } catch (err) {
    btn.textContent = 'No se pudo: inténtalo otra vez'
  } finally {
    btn.disabled = false
    setTimeout(() => { if (!btn.disabled) btn.textContent = btn.dataset.label }, 2500)
  }
}

// "Descargar la 360": la foto 360 completa (con los datos de foto esférica:
// Google Fotos y la galería la abren como 360).
$('#panoFull').onclick = async (e) => {
  const btn = e.currentTarget
  if (btn.disabled || !panoId) return
  try {
    if (!blobs.has(panoId)) { btn.disabled = true; btn.textContent = 'Descargando…' }
    const file = await fetchFile(panoId, `La-Cima-de-la-13-${panoName}-360.jpg`)
    btn.disabled = false
    await saveFile(btn, file, btn.dataset.label)
  } catch (err) {
    btn.textContent = btn.dataset.label
    location.href = CFG.download + panoId
  } finally {
    btn.disabled = false
  }
}

poll()
</script>
